<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>慈惠堂報名後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 後台：上方固定搜尋列，下方一筆一張卡；與報名頁同一套色彩與字體 */
:root{
  --paper:#F7F5F1; --surface:#FFFFFF; --ink:#23201C; --muted:#6B645A;
  --line:#E2DCD1; --red:#9B2226; --red-ink:#FFFFFF; --red-soft:#F6E7E4;
  --gold:#A87B22; --gold-soft:#F5EDDC; --ok:#2E6B3A; --ok-soft:#E3F0E5; --hl:#FFF0B3;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:18px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#17130F; --surface:#221C17; --ink:#F1ECE3; --muted:#B5AC9F;
  --line:#3A322A; --red:#E0675F; --red-ink:#1A0E0C; --red-soft:#3A1F1C;
  --gold:#D9AE58; --gold-soft:#332917; --ok:#8BD39A; --ok-soft:#1E3324; --hl:#5A4A12; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#17130F; --surface:#221C17; --ink:#F1ECE3; --muted:#B5AC9F;
  --line:#3A322A; --red:#E0675F; --red-ink:#1A0E0C; --red-soft:#3A1F1C;
  --gold:#D9AE58; --gold-soft:#332917; --ok:#8BD39A; --ok-soft:#1E3324; --hl:#5A4A12; color-scheme:dark }
:root.big{ --fs:22px }

*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.3;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{background:#fff;border-radius:8px;padding:3px 7px;display:flex;flex:none}
.logo img{height:36px;width:auto;display:block}
.brand h1{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){ .top{flex-wrap:wrap} .logo img{height:28px} .brand h1{font-size:1rem} .top > div:last-child{width:100%;justify-content:flex-end} .pillbtn{padding:5px 10px} }
input[type=search]::-webkit-search-cancel-button{display:none}
.pillbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.85rem;white-space:nowrap}

.demo{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:12px}

/* 登入 */
.login{max-width:420px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:grid;gap:14px}
.login h2{font-size:1.4rem;color:#356D82}
.login p{margin:0;color:var(--muted);font-size:.92rem}
input[type=password],input[type=search],select{width:100%;min-height:3rem;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;padding:0 22px;border-radius:12px;border:2px solid transparent;cursor:pointer;font-weight:700;font-size:1rem}
.btn.primary{background:#356D82;color:#fff}
.btn.okb{background:var(--ok);color:var(--surface)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.small{min-height:2.5rem;padding:0 14px;font-size:.92rem}
.err{color:var(--red);font-size:.9rem}

/* 搜尋列 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:8px 0 12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.searchbox{position:relative}
.searchbox input{font-size:1.15rem;min-height:3.4rem;padding-right:3rem;border-width:2px;border-color:var(--ink)}
.searchbox .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:var(--line);border-radius:50%;width:2rem;height:2rem;cursor:pointer;font-size:1rem;line-height:1}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:none;background:none;padding:8px 4px;cursor:pointer;min-height:3rem;font-size:.92rem;white-space:nowrap}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.count{font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:560px){ .filters{grid-template-columns:1fr} }

/* 結果卡 */
.list{display:grid;gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.card.paid{border-left:6px solid var(--ok)}
.card.unpaid{border-left:6px solid var(--red)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ref{font-family:var(--mono);font-size:1.3rem;font-weight:700;letter-spacing:.04em}
.status{font-size:.85rem;font-weight:700;border-radius:999px;padding:4px 12px;white-space:nowrap}
.status.unpaid{background:var(--red-soft);color:var(--red)}
.status.paid{background:var(--ok-soft);color:var(--ok)}
.meta{color:var(--muted);font-size:.88rem;margin-top:2px}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.contact{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:1rem}
.contact .phone{font-variant-numeric:tabular-nums}
.sec h3{font-family:var(--sans);font-size:.82rem;color:var(--muted);letter-spacing:.1em;margin-bottom:4px}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.person:first-of-type{border-top:none}
.person .nm{font-weight:700;font-size:1.05rem}
.person .info{color:var(--muted);font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chip{background:var(--gold-soft);border-radius:999px;padding:2px 12px;font-size:.92rem}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.amt{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.amt small{font-size:.8rem;color:var(--muted);font-weight:500;margin-right:6px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--gold-soft);border-radius:10px;padding:10px 12px;width:100%}
.confirm span{flex:1 1 12em;font-weight:500}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:.85rem}
.settings{max-width:520px;margin:24px auto;display:grid;gap:16px}
.settings h2{font-size:1.4rem;color:#356D82}
.settings .hint{color:var(--muted);font-size:.88rem;margin:0}
.pwcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px}
.pwcard h3{font-size:1.1rem}
.pwcard label{font-weight:700;font-size:.92rem;margin-top:4px}
.pwcard input{width:100%;min-height:3rem;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.pwmsg{font-weight:700;margin:0;min-height:1.4em}
.pwmsg.ok{color:var(--ok)} .pwmsg.bad{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}
</style>
</head>

  <!-- 登入 -->
  <section class="login" id="loginView">
    <h2>後台登入</h2>
    <p>義工請輸入義工密碼；負責人或堂主請輸入管理密碼。</p>
    <input type="password" id="pw" autocomplete="current-password" aria-label="後台密碼" placeholder="密碼">
    <button class="btn primary" id="loginBtn" type="button">登入</button>
    <div class="err" id="loginErr" role="alert"></div>
    <p id="demoLoginNote" hidden>示範版：義工密碼 1234，管理密碼 8888。</p>
  </section>

  <!-- 密碼設定（只有負責人／堂主看得到） -->
  <section id="settingsView" hidden>
    <div class="settings">
      <h2>密碼設定</h2>
      <p class="hint">義工共用一組「義工密碼」，只能查詢和收款。負責人和堂主用「管理密碼」登入，可以在這裡修改密碼。</p>
      <div class="pwcard">
        <h3>義工密碼</h3>
        <p class="hint" id="volChanged"></p>
        <label for="volNew">新的義工密碼</label><input type="password" id="volNew" autocomplete="new-password">
        <label for="volNew2">再輸入一次</label><input type="password" id="volNew2" autocomplete="new-password">
        <button class="btn primary" id="volSave" type="button">更新義工密碼</button>
        <p class="hint">更新後，請告訴義工新密碼。已經登入的義工，下次登入就要用新密碼。</p>
      </div>
      <div class="pwcard">
        <h3>管理密碼</h3>
        <label for="admCur">目前的管理密碼</label><input type="password" id="admCur" autocomplete="current-password">
        <label for="admNew">新的管理密碼</label><input type="password" id="admNew" autocomplete="new-password">
        <label for="admNew2">再輸入一次</label><input type="password" id="admNew2" autocomplete="new-password">
        <button class="btn primary" id="admSave" type="button">更新管理密碼</button>
      </div>
      <p class="pwmsg" id="pwMsg" role="status"></p>
      <button class="btn ghost" id="backBtn" type="button">回到報名名單</button>
    </div>
  </section>

  <!-- 主畫面 -->
  <main id="mainView" hidden>

      <div class="searchbox">
        <input type="search" id="q" placeholder="輸入電話、報名編號或姓名" aria-label="搜尋電話、報名編號或姓名" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="clearQ" type="button" aria-label="清除搜尋" hidden>✕</button>
      </div>
      <div class="filters">
        <div class="seg" role="group" aria-label="繳費狀態" id="segPaid">
          <button type="button" data-paid="all" aria-pressed="true">全部</button>
          <button type="button" data-paid="unpaid" aria-pressed="false">未繳費</button>
          <button type="button" data-paid="paid" aria-pressed="false">已繳清</button>
        </div>
        <select id="formFilter" aria-label="表單或法會場次"></select>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>

<script>
/* ================= 設定 ================= */
const CONFIG = {
  apiUrl: "",   // Google Apps Script 網址；留空 = 示範模式
  lampTitle: "啟點光明燈暨安奉太歲",
  events: [     // 與報名頁的場次設定相同
    {id:"2027-zhongyuan", name:"瑤池金母聖誕祈福消災超渡暨普渡大法會"},
    {id:"2027-spring-lidou", name:"春季祈安禮斗法會"},
    {id:"2027-autumn-lidou", name:"秋季祈安禮斗法會"},
  ],
};
const DEMO = !CONFIG.apiUrl;

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const digits = s => String(s||"").replace(/\D/g,"");
const LMONTH = ["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
const LDAY = (()=>{const a=[],n="一二三四五六七八九十";for(let d=1;d<=30;d++){a.push(d<=10?"初"+n[d-1]:d<20?"十"+n[d-11]:d===20?"二十":d<30?"廿"+n[d-21]:"三十")}return a})();
const lunarText = b => { const L=b&&b.lunar; if(!L) return ""; return `${L.year}年${L.leap?"閏":""}${LMONTH[L.month-1]}${LDAY[L.day-1]}${L.hour?" "+L.hour+"時":""}`; };
const fmtDate = iso => { const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const money = n => n==null ? "—" : "$"+Number(n).toLocaleString();

/* ================= 資料來源 ================= */
// 示範模式：範例資料＋這台電腦上報名頁送出的測試資料；繳費狀態存在本機
function sampleData(){
  const t = d => new Date(Date.now()-d*36e5).toISOString();
  const B = (y,m,d,h="") => ({lunar:{year:y,month:m,leap:false,day:d,hour:h},solar:null,entered:"lunar"});
  return [
    {ref:"L261018-2041", sample:true, paid:true, paidAt:t(20), form:"lamp", formTitle:CONFIG.lampTitle, submittedAt:t(52),
     contact:{name:"王秀英",phone:"(718) 555-0142",address:"範例地址"},
     lamps:[{name:"王秀英",birth:B(1958,8,12,"辰"),zodiac:"狗",age_xu:69,lampTypes:["個人光明燈","太歲燈"]},
            {name:"李建國",birth:B(1955,3,3),zodiac:"羊",age_xu:72,lampTypes:["個人光明燈"]}],
     chaodu:[],meals:[],totals:{all:360}},
    {ref:"L261019-5528", sample:true, paid:false, form:"lamp", formTitle:CONFIG.lampTitle, submittedAt:t(30),
     contact:{name:"張雅婷",phone:"(347) 555-0198",address:"範例地址"},
     lamps:[{name:"張雅婷",birth:B(1986,11,2,"午"),zodiac:"虎",age_xu:41,lampTypes:["五路財神燈"]},
            {name:"陳柏宇",birth:B(2012,6,18),zodiac:"龍",age_xu:15,lampTypes:["文昌燈","個人光明燈"]},
            {name:"陳品妍",birth:B(2015,1,9),zodiac:"羊",age_xu:12,lampTypes:["文昌燈"]}],
     chaodu:[],meals:[],totals:{all:480}},
    {ref:"F261019-0377", sample:true, paid:false, form:"fahui", eventId:"2027-zhongyuan", formTitle:CONFIG.events[0].name, submittedAt:t(26),
     contact:{name:"林美華",phone:"(917) 555-0111",address:"範例地址"},
     lamps:[{name:"林美華",birth:B(1963,2,20),zodiac:"兔",age_xu:64,lampTypes:["蓮花福慧燈"]}],
     chaodu:[{type:"亡者",name:"林德福",title:"先父",birth:B(1930,5,1),death:B(2019,9,9),age:90,sponsor:"林美華"},
             {type:"歷代祖先",name:"林氏歷代祖先",title:"",birth:null,death:null,age:null,sponsor:"林美華"}],
     meals:[{name:"林美華",amount:50}], totals:{all:430}},
    {ref:"F261020-8812", sample:true, paid:true, paidAt:t(2), form:"fahui", eventId:"2027-spring-lidou", formTitle:CONFIG.events[1].name, submittedAt:t(6),
     contact:{name:"黃志強",phone:"(718) 555-0175",address:"範例地址"},
     lamps:[{name:"黃志強",birth:B(1972,7,7),zodiac:"鼠",age_xu:55,lampTypes:["蓮花福慧燈"]},
            {name:"黃淑芬",birth:B(1975,10,30),zodiac:"兔",age_xu:52,lampTypes:["蓮花福慧燈"]}],
     chaodu:[],meals:[],totals:{all:120}},
  ];
}
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const API = {
  async list(){
    if(!DEMO){ const r=await fetch(`${CONFIG.apiUrl}?action=list&key=${encodeURIComponent(session())}`); if(!r.ok) throw new Error(r.status); return (await r.json()).rows; }
    const paidMap = LS.get("tsuhui-demo-paid",{});
    return [...sampleData(), ...LS.get("tsuhui-demo-db",[])].map(r=> paidMap[r.ref] ? {...r, ...paidMap[r.ref]} : r);
  },
  async setPaid(ref, paid){
    const rec = {paid, paidAt: paid ? new Date().toISOString() : null};
    if(!DEMO){ const r=await fetch(CONFIG.apiUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"setPaid",key:session(),ref,paid})}); if(!r.ok) throw new Error(r.status); return rec; }
    const m=LS.get("tsuhui-demo-paid",{}); m[ref]=rec; LS.set("tsuhui-demo-paid",m); return rec;
  },
};
// 登入狀態：{key:密碼, role:"admin"|"volunteer"}
function sess(){ try{ return JSON.parse(sessionStorage.getItem("tsuhui-admin")||"null"); }catch(e){ return window._sess||null; } }
function setSess(v){ try{ v?sessionStorage.setItem("tsuhui-admin",JSON.stringify(v)):sessionStorage.removeItem("tsuhui-admin"); }catch(e){ window._sess=v; } }
function session(){ return sess()?.key||""; }
async function hashPw(pw){
  try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("tsuhui:"+pw)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; for(const c of "tsuhui:"+pw) h=(h*31+c.charCodeAt(0))|0; return "x"+h; }
}
async function demoPw(){
  let p=LS.get("tsuhui-demo-pw",null);
  if(!p){ p={vol:await hashPw("1234"), admin:await hashPw("8888"), volChangedAt:null}; LS.set("tsuhui-demo-pw",p); }
  return p;
}
API.login = async function(pw){
  if(!DEMO){ const r=await fetch(`${CONFIG.apiUrl}?action=login&key=${encodeURIComponent(pw)}`); const j=await r.json(); return j.ok?j.role:null; }
  const p=await demoPw(), h=await hashPw(pw);
  return h===p.admin ? "admin" : h===p.vol ? "volunteer" : null;
};
API.changePw = async function(kind, newPw, adminPw){
  if(!DEMO){ const r=await fetch(CONFIG.apiUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"changePassword",key:adminPw,kind,newPw})}); const j=await r.json(); if(!j.ok) throw new Error(j.error||"fail"); return; }
  const p=await demoPw();
  if(await hashPw(adminPw)!==p.admin) throw new Error("admin");
  if(kind==="vol"){ p.vol=await hashPw(newPw); p.volChangedAt=new Date().toISOString(); } else { p.admin=await hashPw(newPw); }
  LS.set("tsuhui-demo-pw",p);
};
API.pwInfo = async function(){ if(!DEMO){ try{ const r=await fetch(`${CONFIG.apiUrl}?action=pwInfo&key=${encodeURIComponent(session())}`); return await r.json(); }catch(e){ return {}; } } return await demoPw(); };

/* ================= 狀態 ================= */
let ROWS = [], F = {q:"", paid:"all", form:"all"}, confirming = null;

/* ================= 搜尋 ================= */
// 回傳 null（不符合）或 {hits:Set(人名)}：電話比數字、編號忽略大小寫與「-」、姓名比所有出現的名字
function match(r, q){
  if(!q) return {hits:new Set()};
  const ql=q.toLowerCase().replace(/[\s-]/g,""), qd=digits(q);
  const hits=new Set(); let ok=false;
  if(r.ref.toLowerCase().replace(/-/g,"").includes(ql)) ok=true;
  if(qd.length>=3 && digits(r.contact.phone).includes(qd)) ok=true;
  const names=[r.contact.name, ...(r.lamps||[]).map(p=>p.name), ...(r.chaodu||[]).flatMap(c=>[c.name,c.sponsor]), ...(r.meals||[]).map(m=>m.name)];
  names.forEach(n=>{ if(n && q.trim() && n.includes(q.trim())){ ok=true; hits.add(n); } });
  return ok ? {hits} : null;
}
const hl = (text, q) => { const t=esc(text); const k=q.trim(); if(!k || /^[\d\s()+-]+$/.test(k)) return t; return t.split(esc(k)).join(`<mark>${esc(k)}</mark>`); };

/* ================= 畫面 ================= */
function formName(r){ return r.form==="lamp" ? CONFIG.lampTitle : (CONFIG.events.find(e=>e.id===r.eventId)||{name:r.formTitle||"法會"}).name; }
function cardHTML(r, m){
  const q=F.q, paid=!!r.paid;
  const lampSec = (r.lamps||[]).length ? `<div class="sec"><h3>${r.form==="lamp"?"點燈":"蓮花福慧燈"}</h3>${r.lamps.map(p=>`
      <div class="person"><span class="nm">${hl(p.name,q)}</span><span class="info">${p.gender?esc(p.gender)+"・":""}${esc(p.zodiac)}・虛歲 ${p.age_xu??""}・${lunarText(p.birth)}</span>
      ${r.form==="lamp"?`<div class="chips">${(p.lampTypes||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}</div>`).join("")}</div>` : "";
  const soulSec = (r.chaodu||[]).length ? `<div class="sec"><h3>超渡</h3>${r.chaodu.map(c=>`
      <div class="person"><span class="nm">${c.type==="亡者"?`${esc(c.title)} ${hl(c.name,q)}`:hl(c.name||c.type,q)}</span><span class="info">陽世報恩人 ${hl(c.sponsor,q)}</span></div>`).join("")}</div>` : "";
  const mealSec = (r.meals||[]).length ? `<div class="sec"><h3>供齋</h3>${r.meals.map(x=>`
      <div class="person"><span class="nm">${hl(x.name,q)}</span><span class="info">${money(x.amount)}</span></div>`).join("")}</div>` : "";
  const total = r.totals ? r.totals.all : null;
  let action;
  if(confirming===r.ref) action = `<div class="confirm"><span>${paid?`確定要把 ${esc(r.ref)} 改回「未繳費」？`:`確定已收到現金 ${money(total)}？`}</span>
      <button class="btn ${paid?"primary":"okb"} small" data-do="${paid?"unpay":"pay"}" data-ref="${esc(r.ref)}" type="button">確定</button>
      <button class="btn ghost small" data-do="cancel" type="button">取消</button></div>`;
  else action = paid ? `<button class="linkbtn" data-ask="${esc(r.ref)}" type="button">改回未繳費</button>`
                     : `<button class="btn okb" data-ask="${esc(r.ref)}" type="button">收款：標記已繳清</button>`;
  return `<article class="card ${paid?"paid":"unpaid"}">
    <div class="card-head">
      <div><div class="ref">${hl(r.ref,q.replace(/-/g,""))}</div><div class="meta">${esc(formName(r))}・報名 ${fmtDate(r.submittedAt)}${r.sample?'<span class="tag">範例</span>':""}</div></div>
      <span class="status ${paid?"paid":"unpaid"}">${paid?`已繳清 ${r.paidAt?fmtDate(r.paidAt):""}`:"待繳費"}</span>
    </div>
    <div class="contact"><span>聯絡人 <b>${hl(r.contact.name,q)}</b></span><span class="phone">${esc(r.contact.phone)}</span></div>
    ${lampSec}${soulSec}${mealSec}
    <div class="foot"><span class="amt"><small>應繳</small>${money(total)}</span>${action}</div>
  </article>`;
}
function render(){
  const res = ROWS.map(r=>[r,match(r,F.q)]).filter(([r,m])=>m
      && (F.paid==="all" || (F.paid==="paid")===!!r.paid)
      && (F.form==="all" || (F.form==="lamp" ? r.form==="lamp" : r.eventId===F.form)))
    .sort((a,b)=>b[0].submittedAt.localeCompare(a[0].submittedAt));
  const unpaid = res.filter(([r])=>!r.paid);
  $("count").innerHTML = `<span>共 <b>${res.length}</b> 筆</span><span>未繳費 <b>${unpaid.length}</b> 筆・<b>${money(unpaid.reduce((a,[r])=>a+(r.totals?.all||0),0))}</b></span>`;
  $("list").innerHTML = res.length ? res.map(([r,m])=>cardHTML(r,m)).join("")
    : `<div class="empty"><b>找不到符合的報名</b>${F.q?"請確認電話、編號或姓名是否輸入正確，或把上方篩選改成「全部」。":"目前還沒有報名資料。"}</div>`;
}
function buildFormFilter(){
  $("formFilter").innerHTML = `<option value="all">全部表單與場次</option><option value="lamp">${esc(CONFIG.lampTitle)}</option>`
    + CONFIG.events.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("");
}

/* ================= 事件 ================= */
$("q").addEventListener("input", e=>{ F.q=e.target.value; $("clearQ").hidden=!F.q; confirming=null; render(); });
$("clearQ").addEventListener("click", ()=>{ $("q").value=""; F.q=""; $("clearQ").hidden=true; render(); $("q").focus(); });
$("segPaid").addEventListener("click", e=>{ const b=e.target.closest("[data-paid]"); if(!b) return; F.paid=b.dataset.paid;
  $("segPaid").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); });
$("formFilter").addEventListener("change", e=>{ F.form=e.target.value; render(); });
$("list").addEventListener("click", async e=>{
  const ask=e.target.closest("[data-ask]"); if(ask){ confirming=ask.dataset.ask; render(); return; }
  const d=e.target.closest("[data-do]"); if(!d) return;
  if(d.dataset.do==="cancel"){ confirming=null; render(); return; }
  d.disabled=true; d.textContent="處理中…";
  try{ const rec=await API.setPaid(d.dataset.ref, d.dataset.do==="pay"); const r=ROWS.find(x=>x.ref===d.dataset.ref); Object.assign(r,rec); confirming=null; render(); }
  catch(err){ d.disabled=false; d.textContent="確定"; d.closest(".confirm").querySelector("span").textContent="網路有問題，還沒存好。請再按一次「確定」。"; }
});

async function enter(){
  $("loginView").hidden=true; $("settingsView").hidden=true; $("mainView").hidden=false; $("logoutBtn").hidden=false; $("demoBar").hidden=!DEMO;
  $("settingsBtn").hidden = sess()?.role!=="admin";
  buildFormFilter();
  $("list").innerHTML=`<div class="empty">載入中…</div>`;
  try{ ROWS = await API.list(); render(); }
  catch(e){ $("list").innerHTML=`<div class="empty"><b>讀不到資料</b>請確認網路，或重新登入。</div>`; }
  $("q").focus();
}
$("loginBtn").addEventListener("click", async ()=>{
  const pw=$("pw").value.trim(); if(!pw){ $("loginErr").textContent="請輸入密碼。"; return; }
  let role=null; try{ role=await API.login(pw); }catch(e){ $("loginErr").textContent="網路有問題，請稍後再試。"; return; }
  if(!role){ $("loginErr").textContent="密碼不正確，請再試一次。"; return; }
  setSess({key:pw, role}); enter();
});
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("logoutBtn").addEventListener("click", ()=>{ setSess(null); location.reload(); });
const pwMsg=(t,ok)=>{ $("pwMsg").textContent=t; $("pwMsg").className="pwmsg "+(ok?"ok":"bad"); };
async function openSettings(){
  $("mainView").hidden=true; $("settingsView").hidden=false; pwMsg("",true);
  ["volNew","volNew2","admCur","admNew","admNew2"].forEach(id=>$(id).value="");
  const info=await API.pwInfo();
  $("volChanged").textContent = info.volChangedAt ? `上次更新：${new Date(info.volChangedAt).toLocaleDateString("zh-TW")}` : "尚未更新過";
}
$("settingsBtn").addEventListener("click", openSettings);
$("backBtn").addEventListener("click", ()=>{ $("settingsView").hidden=true; $("mainView").hidden=false; });
function checkNew(a,b){ if(a.length<4) return "新密碼至少要 4 個字元。"; if(a!==b) return "兩次輸入的新密碼不一樣，請再輸入一次。"; return ""; }
$("volSave").addEventListener("click", async ()=>{
  const a=$("volNew").value.trim(), b=$("volNew2").value.trim(); const err=checkNew(a,b); if(err) return pwMsg(err,false);
  if(a===session()) return pwMsg("義工密碼不能和管理密碼一樣。",false);
  try{ await API.changePw("vol", a, session()); pwMsg("義工密碼已更新。請把新密碼告訴義工。",true); $("volNew").value=$("volNew2").value=""; openSettingsInfo(); }
  catch(e){ pwMsg("更新失敗，請重新登入後再試。",false); }
});
async function openSettingsInfo(){ const info=await API.pwInfo(); $("volChanged").textContent = info.volChangedAt ? `上次更新：${new Date(info.volChangedAt).toLocaleDateString("zh-TW")}` : "尚未更新過"; }
$("admSave").addEventListener("click", async ()=>{
  const cur=$("admCur").value.trim(), a=$("admNew").value.trim(), b=$("admNew2").value.trim();
  if(!cur) return pwMsg("請輸入目前的管理密碼。",false);
  const err=checkNew(a,b); if(err) return pwMsg(err,false);
  try{ await API.changePw("admin", a, cur); setSess({key:a, role:"admin"}); pwMsg("管理密碼已更新。下次請用新密碼登入。",true); ["admCur","admNew","admNew2"].forEach(id=>$(id).value=""); }
  catch(e){ pwMsg(e.message==="admin"?"目前的管理密碼不正確。":"更新失敗，請稍後再試。",false); }
});
function setBig(on){ document.documentElement.classList.toggle("big",on); $("sizeBtn").textContent=on?"字縮小":"字放大"; try{localStorage.setItem("tsuhui-big",on?"1":"")}catch(e){} }
$("sizeBtn").addEventListener("click", ()=>setBig(!document.documentElement.classList.contains("big")));
try{ if(localStorage.getItem("tsuhui-big")) setBig(true); }catch(e){}
$("demoLoginNote").hidden=!DEMO;
if(sess()) enter();
</script>
</body>
</html>
